# Dependabot: keep npm dependencies patched on a weekly cadence.
# Security updates still arrive immediately via Dependabot security alerts;
# this schedule only governs routine version bumps.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Casablanca"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
